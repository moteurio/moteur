packages:
    - 'packages/*'

# Security floors for transitive dependencies (pnpm 10+ reads these here; pnpm 11 ignores the "pnpm" field in package.json).
overrides:
    form-data: '>=4.0.4'
    glob: '>=10.5.0'
    jws: '>=3.2.3'
    axios: '>=1.20.0'
    qs: '>=6.14.2'
    minimatch: '>=9.0.7'
    rollup: '>=4.59.0'
    vite: '>=7.3.5'
    js-yaml: '>=4.1.1'
    tmp: '>=0.2.4'
    diff: '>=8.0.3'
    '@eslint/plugin-kit': '>=0.3.4'
    'table>ajv': '>=8.18.0'

allowBuilds:
    bcrypt: true
    esbuild: false
