# pnpm (the version in package.json's packageManager), Node with the pnpm store cached,
# and the workspace's dependencies as the lockfile has them.
name: Set up the workspace
description: pnpm, Node.js and dependencies

inputs:
    node-version:
        description: Node.js version
        default: '24'
    registry-url:
        description: npm registry, set only when publishing
        default: ''

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v6

        - uses: actions/setup-node@v7
          with:
              node-version: ${{ inputs.node-version }}
              cache: pnpm
              registry-url: ${{ inputs.registry-url }}

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
