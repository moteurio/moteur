# Publish @moteurio/api to npm when a tag api@<version> is pushed.
# Requires NPM_STAGING_TOKEN (granular, stage only) or approve after npm stage publish locally.
name: Release @moteurio/api

on:
    push:
        tags:
            - 'api@*'

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install dependencies
              run: pnpm install

            - name: Test api package
              run: pnpm --filter @moteurio/api test

            - name: Build api package
              run: pnpm --filter @moteurio/api run build

            - name: Ensure npm for staged publish
              run: npm install -g npm@11.15

            - name: Stage on npm
              working-directory: packages/api
              run: npm stage publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGING_TOKEN }}
