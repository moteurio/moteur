name: Release Orchestrator

on:
    workflow_dispatch:
        inputs:
            release_client_cli:
                description: 'Also publish @moteurio/cli'
                required: false
                default: 'true'
                type: choice
                options:
                    - 'false'
                    - 'true'
            release_version_override:
                description: 'Optional npm version (same-day republish: e.g. 2026.3.28-2). Empty = UTC calendar date YYYY.M.D'
                required: false
                default: ''
                type: string

permissions:
    contents: read

concurrency:
    group: release-orchestrator
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGING_TOKEN }}
        steps:
            - name: Require RELEASE_PAT
              run: |
                  if [ -z "$RELEASE_PAT" ]; then
                    echo "::error::Set repository secret RELEASE_PAT (PAT with push + releases; see RELEASING.md)."
                    exit 1
                  fi
              env:
                  RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

            - name: Require NPM_STAGING_TOKEN
              run: |
                  if [ -z "$NPM_STAGING_TOKEN" ]; then
                    echo "::error::Set repository secret NPM_STAGING_TOKEN (granular, Read and write stage only, @moteurio/*). See RELEASING.md."
                    exit 1
                  fi
              env:
                  NPM_STAGING_TOKEN: ${{ secrets.NPM_STAGING_TOKEN }}

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Ensure npm for staged publish
              run: npm install -g npm@11.15

            - name: Install dependencies
              run: pnpm install

            - name: Set release line from UTC date
              run: |
                  VERSION=$(node scripts/set-release-version-from-date.mjs)
                  echo "EXPECTED_MOTEUR_LINE=$VERSION" >> "$GITHUB_ENV"
                  echo "Release line: $VERSION"
              env:
                  RELEASE_VERSION: ${{ inputs.release_version_override }}

            - name: Prepend CHANGELOG and write release notes
              run: |
                  export RELEASE_NOTES_FILE="$RUNNER_TEMP/release-notes.md"
                  echo "RELEASE_NOTES_FILE=$RELEASE_NOTES_FILE" >> "$GITHUB_ENV"
                  node scripts/prepend-release-changelog.mjs

            - name: Commit release and push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote set-url origin "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
                  git add packages/*/package.json CHANGELOG.md
                  if git diff --cached --quiet; then
                    echo "No staged changes; aborting"
                    exit 1
                  fi
                  git commit -m "chore(release): ${EXPECTED_MOTEUR_LINE}"
                  git push origin "HEAD:${GITHUB_REF_NAME}"
              env:
                  RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

            - name: Tag release and push tag
              run: |
                  git tag "moteur@${EXPECTED_MOTEUR_LINE}"
                  git push origin "moteur@${EXPECTED_MOTEUR_LINE}"
              env:
                  RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

            - name: Validate release line policy
              run: node scripts/validate-release-versions.mjs

            - name: Stage @moteurio/types on npm
              run: pnpm --filter @moteurio/types test && pnpm --filter @moteurio/types run build && cd packages/types && npm stage publish --access public

            - name: Stage @moteurio/plugin-sdk on npm
              run: pnpm --filter @moteurio/plugin-sdk test && pnpm --filter @moteurio/plugin-sdk run build && cd packages/plugin-sdk && npm stage publish --access public

            - name: Stage @moteurio/studio-plugin-sdk on npm
              run: pnpm --filter @moteurio/studio-plugin-sdk test && pnpm --filter @moteurio/studio-plugin-sdk run build && cd packages/studio-plugin-sdk && npm stage publish --access public

            - name: Stage @moteurio/core on npm
              run: pnpm --filter @moteurio/core test && pnpm --filter @moteurio/core run build && cd packages/core && npm stage publish --access public

            - name: Stage @moteurio/client on npm
              run: pnpm --filter @moteurio/client test && pnpm --filter @moteurio/client run build && cd packages/client && npm stage publish --access public

            - name: Stage @moteurio/commands on npm
              run: pnpm --filter @moteurio/commands test && pnpm --filter @moteurio/commands run build && cd packages/commands && npm stage publish --access public

            - name: Stage @moteurio/mcp on npm
              run: pnpm --filter @moteurio/mcp test && pnpm --filter @moteurio/mcp run build && cd packages/mcp && npm stage publish --access public

            - name: Stage @moteurio/api on npm
              run: pnpm --filter @moteurio/api test && pnpm --filter @moteurio/api run build && cd packages/api && npm stage publish --access public

            - name: Stage optional @moteurio/cli on npm
              if: ${{ inputs.release_client_cli == 'true' }}
              run: pnpm --filter @moteurio/cli test && pnpm --filter @moteurio/cli run build && cd packages/cli && npm stage publish --access public

            - name: Approve staged packages (maintainer, outside CI)
              run: |
                  echo "::warning::Versions are on npm's staging area, not live yet."
                  echo "Approve each package with 2FA: https://www.npmjs.com/settings/~/packages/staged"
                  echo "Or locally: npm stage list && npm stage approve <stage-id>"

            - name: Create GitHub Release
              run: |
                  gh release create "moteur@${EXPECTED_MOTEUR_LINE}" \
                    --title "moteur ${EXPECTED_MOTEUR_LINE}" \
                    --notes-file "${RELEASE_NOTES_FILE}"
              env:
                  GH_TOKEN: ${{ secrets.RELEASE_PAT }}
