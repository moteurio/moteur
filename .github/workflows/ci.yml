name: CI

on:
    push:
        branches: [main, feat/**, feature/**, chore/**, fix/**, docs/**]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install pnpm
              run: npm install -g pnpm@11.22

            - name: Install dependencies
              run: pnpm install

            - name: Lint
              run: pnpm -r lint

            - name: Build
              run: pnpm -r build

            - name: OpenAPI success responses
              run: pnpm --filter @moteurio/api run openapi:check-responses

            - name: Test
              run: pnpm -r test
